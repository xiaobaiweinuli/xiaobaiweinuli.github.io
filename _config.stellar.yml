# Stellar v2 站点配置（由 1.33.1 迁移而来）
# 站点通过本文件覆盖主题默认值；未列出的字段使用主题默认配置。

open_graph:
  enabled: true
  twitter_id: # for open_graph meta

# 生成 canonical 链接；host 为站点主机名，用于告诉搜索引擎真实地址
canonical:
  host: xiaobaiweinuli.github.io

# Google Search Console 站点验证（HTML 标记）；原样插入 </head> 前
inject:
  head_end: '<meta name="google-site-verification" content="6ut0tqLY1N9qhNAWKxkMtXMWec4FuqVx1A4E-qn8yLM" />'

# 站点主结构树（v2：profiles）
profiles:
  # 主页配置
  home:
    active_menu: post
    leftbar:
      widgets:
        - recent
    rightbar:
      widgets:
        - welcome
  # 作者信息配置
  author:
    path: /author/
    leftbar:
      widgets:
        - recent
        - timeline
    rightbar:
      widgets:
        - timeline
  # 文档列表页
  wiki_index:
    active_menu: wiki
  # 文档内页（v2 默认隐藏站点固定菜单，故不设置 active_menu）
  wiki: {}
  # 错误页
  error:
    leftbar:
      widgets:
        - recent
        - timeline
    rightbar:
      widgets:
        - timeline

article:
  style: tech
  # tech/story  tech: 默认技术类文章, story: 图文类文章
  # 分类名到主题色的映射，未列出的分类使用主题默认色
  category_colors:
    教程: '#1BCDFC'
    Android: '#3DC550'
    API: '#7C4DFF'
    SAAS回源加速: '#FF9800'
    棋牌桌游: '#F44336'
  # 相关文章最大数量，0 表示不显示相关文章（原 related_posts.enable: true）
  listing:
    card_layout: classic # 列表卡片布局；classic: 顶部横幅图 + 下方文字（配了 cover 才有图）
  related_posts_limit: 5
  footer:
    # 文章许可协议
    license: '本文由{author.name}编写，采用采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
    # 分享服务（原 [wechat, weibo, email, link] → wechat 改为 qrcode，link 无对应项）
    share:
      - qrcode
      - weibo
      - email

# 侧边栏品牌区域（原 logo）
leftbar:
  brand:
    image:
      src: /customize/images/avatar.jpg
    name: 星霜笔记
    tagline: "xingshuang's blog"
    href: /
  # 主功能导航菜单（原 menubar columns:4；v2 中 >2 列为纯图标，与 v1 图标菜单一致）
  menu_columns: 3
  menu:
    - id: post
      title: 博客
      icon: default:documents
      accent: '#1BCDFC'
      url: /
    - id: wiki
      title: 文档
      icon: default:notebook
      accent: '#3DC550'
      url: /wiki/
    - id: friends
      title: 友链
      icon: default:link
      accent: '#F44336'
      url: /friends/

# 文章搜索
search:
  provider: local
  local:
    scope: all # all, post, page
    include_content: true # 是否搜索内容
    cache_ttl_seconds: 86400

comments:
  provider: giscus
  # giscus
  # https://giscus.app/zh-CN
  giscus:
    js: https://giscus.app/client.js
    data-repo: xiaobaiweinuli/issues # [在此输入仓库]
    data-repo-id: R_kgDOKz8_JQ # [在此输入仓库 ID]
    data-category: Announcements # [在此输入分类名]
    data-category-id: DIC_kwDOKz8_Jc4CcAYx # [在此输入分类 ID]
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top # top, bottom
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: lazy
    crossorigin: anonymous

footer:
  sitemap:
    - title: 博客
      items:
        - '[近期发布](/)'
        - '[分类](/categories/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 项目
      items:
        - '[开源项目](/wiki/qywxtz/)'
        - '[星霜图库](https://images.xingshuang.xyz/)'
        - '[网页归档](https://archive.xingshuang.xyz/)'
        - '[知识笔记](https://blinko.xingshuang.xyz)'
  content: | # 支持 Markdown 格式
    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。
    本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。
    <span class="jinrishici-sentence"></span>
    <script src="https://sdk.jinrishici.com/v2/browser/jinrishici.js" charset="utf-8"></script>
  # 主题用户越多，开发者维护和更新的积极性就越高，如果您喜欢本主题，请在适当的位置显示主题信息和仓库链接以表支持。

# 外观预设（v2 新增）：minimal 暖纸色编辑风，靠排版分层而非卡片边框
appearance:
  preset: minimal

features:
  # 中文排版增强：中英文自动加空格、标点挤压
  heti:
    enabled: true
